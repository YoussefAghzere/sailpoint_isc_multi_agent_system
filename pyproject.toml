[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isc-agent-platform"
version = "0.3.0"
description = "Evidence-driven SailPoint ISC integration engineering workspace"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "cryptography>=43", "jsonschema>=4.23,<5", "PyYAML>=6,<7"]

[project.scripts]
isc-agents = "isc_agents.cli:main"
isc-platform = "isc_agents.platform.server:main"

[tool.setuptools.package-data]
"isc_agents.platform" = ["static/*"]

[tool.setuptools.packages.find]
include = ["isc_agents*"]
